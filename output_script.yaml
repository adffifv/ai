scenes:
- characters:
  - char_001
  - char_002
  emotional_arc: 压抑→冷峻→骤然窒息（当林深俯身看清死者紧握纸条的瞬间）
  estimated_lines: 32
  scene_id: S001
  script:
  - action: 蹲在尸体旁，戴手套的手轻轻托起死者右手腕，露出掌心褶皱处半露的湿透纸角；抬眼望向林深，镜片后目光沉静如刃。
    character: char_002
    dialogue: 又是刀伤，和上个月那起一模一样。
  - action: 伞沿微压，侧身俯视；雨水顺伞骨滑落，在肩章铜扣上碎成星点。他未应声，只将伞柄换至左手，右手缓缓探向死者紧攥的拳头——指尖悬停半寸，呼吸微滞。
    character: char_001
    dialogue: ''
  - action: 拇指轻推死者小指关节，纸条完全显露：A4纸裁边粗糙，打印体‘林深’二字墨色浓黑，边缘微洇。
    character: char_002
    dialogue: ……你最好自己看。
  setting:
    atmosphere: 暴雨倾盆，昏黄路灯在水雾中晕染成光斑，地面血水混着雨水蜿蜒流淌，警戒线在风中剧烈摆动
    location: 老城区窄巷深处，青砖墙围合的废弃修车铺后巷
    time_of_day: night
  title: 雨夜命案现场
- characters:
  - char_001
  - char_002
  emotional_arc: 专业克制→瞳孔收缩→身体微僵（名字被念出时法医停顿半秒，林深喉结滚动）
  estimated_lines: 18
  scene_id: S002
  script:
  - action: 用镊子尖端轻挑纸条一角，灯光下显出细微水波纹肌理；余光扫过林深下颌线。
    character: char_002
    dialogue: 无外伤胁迫痕迹，攥握力度符合濒死反射；纸张纤维与周边环境泥水成分一致——非事后塞入。
  - action: 左手食指缓慢叩击证物袋边缘三次，节奏顿挫；右手指腹隔着塑料袋摩挲‘林深’二字笔画，喉结上下滑动。
    character: char_001
    dialogue: ……他认得我。
  - action: 收镊入盒，转身走向勘查车，白大褂下摆掠过雨渍斑驳的砖墙——未回头，但脚步比来时慢了半拍。
    character: char_002
    dialogue: 或者，他想让你认得他。
  setting:
    atmosphere: 雨声渐弱，只剩滴答水声；灯光刺白，聚焦于摊开的湿透纸条，字迹清晰锐利，背景是模糊晃动的警员剪影
    location: 巷口临时证物台（折叠桌、强光便携灯、黑色证物袋）
    time_of_day: night
  title: 纸条特写与无声对峙
- characters:
  - char_001
  emotional_arc: 专注→疑虑加深→指尖停驻在屏幕‘无生物痕迹’报告上，呼吸变沉
  estimated_lines: 26
  scene_id: S003
  script:
  - action: 放大纸条扫描图：字体为标准微软雅黑，行距22磅，无墨点飞溅；切换至指纹增强模式——全屏灰白噪点，零显影。
    character: char_001
    dialogue: ''
  - action: 语音输入指令，屏幕弹出设备分布热力图；他凝视图中老城区红点密集区，指尖悬停，未点击。
    character: char_001
    dialogue: 打印机型号……HP LaserJet Pro MFP M428fdw。全市备案存量173台。
  - action: 调取上月卷宗伤口三维重建模型，拖拽叠合当前案例——两道创口拓扑完全重合，误差<0.3mm。他忽然静止，目光钉在报告末行：‘未检出皮屑、汗液、DNA——洁净到反常’。
    character: char_001
    dialogue: ''
  setting:
    atmosphere: 寂静如真空，只有仪器低频嗡鸣；窗外天色铅灰，百叶窗缝隙透入一道窄光，斜切过桌面纸条高清扫描图
    location: 市局刑侦支队证物分析室，玻璃隔断内，冷白光，显微镜与电子比对屏幽幽亮着
    time_of_day: early_morning
  title: 警局证物室：无痕之纸
- characters:
  - char_001
  emotional_arc: 理性推演→寒意上涌→凝视日历的手指缓慢收紧（倒计时数字仿佛在跳动）
  estimated_lines: 21
  scene_id: S004
  script:
  - action: 粉笔尖划过黑板，标出两案时间轴；在‘5月10日’右侧重重画下‘D+20’，红圈内填‘6月9日’。
    character: char_001
    dialogue: 第一案：4月12日23:17，修车铺后巷；第二案：5月10日23:09……间隔28天11小时52分。
  - action: 撕下日历页，背面速绘棋盘格——‘第一局’‘第二局’‘第三局’纵向排列；在‘第二局’旁标注‘纸条’，‘第三局’旁画问号，再添一行小字：‘他要我看懂规则’。
    character: char_001
    dialogue: 不是随机。是排练。
  - action: 突然停笔。凝视‘6月9日’红圈，指腹用力按压纸面，留下半月形凹痕；窗外鸟群掠过，影子一闪而逝。
    character: char_001
    dialogue: ''
  setting:
    atmosphere: 晨光勉强穿透积尘玻璃，照见悬浮微粒；黑板中央用红笔圈出‘28±1天’，下方箭头直指‘D+20’，旁边潦草标注‘第三局倒计时’
    location: 林深办公室，黑板贴满两张命案现场图、伤口拓扑叠图、日历标记红圈
    time_of_day: morning
  title: 时间模型：28日周期
- characters:
  - char_001
  - char_003
  emotional_arc: 克制问询→共情震颤→沉默压境（当苏晚低声说出‘他知道我看见了什么’，镜头掠过她发白的指节）
  estimated_lines: 34
  scene_id: S005
  script:
  - action: 左手抚过星轨戒指凸起纹路，视线始终落在林深左耳后方；茶几上安神茶包装膜反光，映出她微微颤抖的睫毛。
    character: char_003
    dialogue: 我哥说，那人从不靠近，只在街对面停着一辆没挂牌的灰面包车……右前灯裂了一道缝，像眯起的眼。
  - action: 身体前倾十五度，双手交叠置于膝上，指节轻叩——节奏与苏晚绞衣角的频率悄然同步。
    character: char_001
    dialogue: 他为什么不说车牌？
  - action: 声音骤然失温，右手猛地攥紧毛衣下摆，指节泛白；窗外忽有鸽群振翅，扑棱声撞在玻璃上。
    character: char_003
    dialogue: ‘他知道我看见了什么。’……就这一句。说完那天，他烧掉了所有速写本。
  setting:
    atmosphere: 雨歇，空气潮湿滞重；光线昏暗，窗帘半拉，苏晚蜷坐沙发一角，手指无意识绞着衣角，墙上挂钟秒针声异常清晰
    location: 城郊老旧居民楼，三室一厅，窗台晾着素色衣物，茶几上放着未拆封的安神茶
    time_of_day: afternoon
  title: 苏晚家客厅：未报警的恐惧
- characters:
  - char_001
  emotional_arc: 职业警觉→脊背发紧→猛然回头却只余空巷（短信提示音与雨声同步放大，心跳声入耳）
  estimated_lines: 15
  scene_id: S006
  script:
  - action: 走出单元门，步速放缓；左手插进风衣口袋，拇指反复摩挲手机冰凉边框——未解锁，仅感知震动频率。
    character: char_001
    dialogue: ''
  - action: 突兀停步，侧颈肌肉绷紧；瞳孔急速收缩——巷口梧桐阴影里，黑伞边缘压低，伞下人影已半转身，风衣下摆旋开一道暗色弧线。
    character: char_001
    dialogue: ''
  - action: 手机屏幕骤亮：【你也在看，对不对？第二局开始了。】他猛回头，巷口唯余雨丝斜织，积水倒映碎云；远处警笛由远及近，又倏然拐弯消散。
    character: char_001
    dialogue: ''
  setting:
    atmosphere: 细雨复起，如雾；林深转身刹那，手机屏幕亮起短信，同时眼角余光捕捉巷口黑伞下迅速隐入拐角的模糊人影，伞沿压至眉骨
    location: 苏晚家楼下窄巷，积水映着灰云，梧桐枝桠割裂天光
    time_of_day: late_afternoon
  title: 雨巷回眸：第二局开始
summary:
  logline: 一名被连环凶案死者点名的刑警，在28天死亡周期倒计时中，循着一张无痕纸条与一句未解密的目击证言，闯入凶手精心设计的‘对局’——而真正的威胁，始于他意识到自己并非猎手，而是被选定的棋手。
  structure:
    climax: 短信送达与巷口人影消失的0.8秒内，林深完成三重认知颠覆：凶手预判其行动路径、掌握其心理节奏、且将整个案件结构化为可迭代的‘对局’——此前所有证据，皆为邀请函。
    inciting_incident: 死者掌心攥着印有林深姓名的打印纸条，打破常规凶案逻辑，将其个人身份强行嵌入犯罪叙事核心。
    resolution: 未发生。剧本终止于悬念临界点：倒计时20天、目击线索未移交、凶手身份与动机仍藏于‘第二局’规则之下，林深站在雨巷中央，第一次以‘参与者’而非‘解谜者’身份直面深渊。
    rising_action: 林深通过伤口拓扑比对确认连环性，建立28日周期模型；同步接触首案死者妹妹苏晚，获知‘他知道我看见了什么’这一指向性证言，并在离场时收到匿名短信‘第二局开始了’，完成从被动调查到主动入局的身份转换。
  theme: 当正义的程序成为凶手的棋谱，真正的破案起点不是发现真相，而是承认自己已被选中——并决定以何种规则，回敬这场凝视。
