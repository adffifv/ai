characters:
- appearance: 约35岁，身形挺拔，常着深色便装或半旧警用风衣，眉宇间有长期熬夜形成的浅纹，眼神锐利而沉郁，雨夜中常以指节轻叩证物袋边缘——无意识的习惯性思考动作。
  background: 市刑警支队重案组骨干，前法医系高材生（后转刑侦），因三年前一桩未破的证人灭口案主动调入老城区分局；独居，无直系亲属在世，档案备注‘高共情阈值，低信任倾向’。
  first_appearance: S001
  id: char_001
  name: 林深
  personality: 冷静缜密、高度自律、隐忍坚韧，具有强烈职业责任感与内在道德张力；面对被标记的危机时表现出克制的警觉与逆向推演本能。
  role_type: protagonist
- appearance: 中年女性，银丝盘发，佩戴防雾护目镜与细框眼镜，白大褂左胸口袋插三支不同颜色的记号笔；说话时指尖常无意识摩挲解剖刀柄模型挂件。
  background: 市局首席法医，从业22年，参与过7起省级督办连环案；曾是林深警校实习导师，知晓其法医背景，故在首案中特意强调‘伤情高度一致’而非仅报结论。
  first_appearance: S001
  id: char_002
  name: 法医
  personality: 专业克制、言语精简、观察入微，习惯用客观陈述传递关键暗示；对林深抱有职业性信任，但保持公职边界。
  role_type: supporting
- appearance: 26岁左右，黑发齐肩，常穿素色高领毛衣与旧帆布包，左手小指戴一枚磨损的银质星轨戒指；交谈时习惯将视线落于对方左耳后方——避免直视却确保不遗漏微表情。
  background: 首案死者苏哲之妹，自由插画师，案发前正为社区口述史项目采集老城区居民记忆；其兄留下的‘他知道我看见了什么’指向某次深夜归家时目睹的异常车辆与车牌局部，该信息尚未录入警方系统。
  first_appearance: S005
  id: char_003
  name: 苏晚
  personality: 表面沉静克制，实则敏锐果决；具备艺术院校视觉传达专业训练形成的细节捕捉力，情绪表达内敛但行动极具目的性；对警方存有戒备，却选择向林深交付关键线索。
  role_type: deuteragonist
